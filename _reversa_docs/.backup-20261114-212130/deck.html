<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="reversa-category" content="diagram">
  <meta name="reversa-producer-agent" content="reversa-docs-storyteller">
  <meta name="reversa-template" content="deck">
  <meta name="reversa-visual-style" content="sober">
  <title>Slide Deck Técnico — ducarmolocacoes</title>
  <link rel="stylesheet" href="assets/css/docs.css">
  <script src="assets/js/data.js"></script>
  <script src="assets/js/nav.js"></script>
  <style>
    .deck-container {
      flex: 1;
      height: 100%;
      background: #0a0f1d;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 1.5rem;
    }
    .slide-viewport {
      width: 100%;
      max-width: 960px;
      height: 540px;
      background: radial-gradient(circle at center, #161e2e 0%, #0f172a 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 2.5rem;
      box-sizing: border-box;
      justify-content: space-between;
    }
    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .slide-title {
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.025em;
    }
    .slide-subtitle {
      font-size: 1.1rem;
      color: var(--accent-blue);
      margin-bottom: 1.5rem;
    }
    .slide-body {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .deck-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 960px;
      margin-top: 1rem;
    }
    .deck-progress {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: monospace;
    }
    .feature-list-deck {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }
    .feature-item-deck {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <header class="reversa-header">
    <a href="index.html" class="brand-section">
      <div class="seal-mini-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="32" height="32" class="seal-mini">
  <circle cx="32" cy="32" r="30" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="32,14 47,23 47,41 32,50 17,41 17,23" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="32" cy="32" r="8" fill="#38bdf8"/>
</svg>
      </div>
      <span class="brand-title">ducarmolocacoes</span>
      <span class="brand-badge">Apresentação Técnica</span>
    </a>
    <nav class="reversa-doc-nav">
            <a href="index.html" data-page-id="index">Visão geral</a>
      <a href="arquitetura.html" data-page-id="arquitetura">Arquitetura 3D</a>
      <a href="modulos.html" data-page-id="modulos">Módulos</a>
      <a href="topologia.html" data-page-id="topologia">Topologia</a>
      <a href="metricas.html" data-page-id="metricas">Métricas</a>
      <a href="glossario.html" data-page-id="glossario">Glossário</a>
      <a href="deck.html" data-page-id="deck">Deck</a>
    </nav>
  </header>

  <div class="main-viewport">
    <div class="deck-container">
      <div class="slide-viewport" id="active-slide">
        <!-- Conteúdo do slide ativo -->
      </div>

      <div class="deck-controls">
        <button id="btn-prev-slide" class="btn">❮ Anterior</button>
        <span class="deck-progress" id="slide-indicator">Slide 1 de 8</span>
        <div style="display: flex; gap: 0.5rem;">
          <button id="btn-fullscreen" class="btn">Fullscreen (F)</button>
          <button id="btn-next-slide" class="btn btn-primary">Próximo ❯</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SLIDES = [
      {
        title: "ducarmolocacoes",
        subtitle: "Sistema de Gestão & Contratos de Locação de Trajes",
        render: () => `
          <div style="text-align: center; margin: auto 0;">
            <div style="font-size: 1.15rem; color: #cbd5e1; max-width: 680px; margin: 0 auto; line-height: 1.6;">
              Visão arquitetural, engenharia reversa de processos de negócio e modelo operacional extraídos via <strong>Reversa Framework</strong>.
            </div>
            <div style="margin-top: 2rem; display: flex; justify-content: center; gap: 1rem;">
              <span class="badge badge-web" style="font-size: 0.85rem; padding: 4px 10px;">Spring Boot 2.0.5</span>
              <span class="badge badge-frontend" style="font-size: 0.85rem; padding: 4px 10px;">Angular 6.1</span>
              <span class="badge badge-repository" style="font-size: 0.85rem; padding: 4px 10px;">MySQL 5.7</span>
              <span class="badge badge-cycle" style="font-size: 0.85rem; padding: 4px 10px;">Elasticsearch 5.6</span>
            </div>
          </div>
        `
      },
      {
        title: "Propósito & Contexto de Negócio",
        subtitle: "Operação da Empresa Du Carmo Locações",
        render: () => `
          <div class="slide-body">
            <p style="margin-bottom: 1rem;">
              A plataforma centraliza a locação de vestuário e trajes para eventos comemorativos (casamentos, formaturas, bailes de debutante e eventos de gala), eliminando riscos de sobreposição de reservas de trajes exclusivos.
            </p>
            <div class="feature-list-deck">
              <div class="feature-item-deck">
                <strong style="color: #38bdf8;">Formalização Imediata:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Emissão automática de minutas contratuais com força jurídica em PDF.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #10b981;">Proteção Temporal de Estoque:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Bloqueio inteligente de agenda de 7 dias [evento - 3 até evento + 4].</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #f59e0b;">Balanço Financeiro Rigoroso:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Cobrança de sinal obrigatório de 20% e saldo devedor quitado na retirada.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #ef4444;">Mitigação de Danos:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Cláusulas de avaria (4x o valor) e multa por atraso (20% ao dia).</p>
              </div>
            </div>
          </div>
        `
      },
      {
        title: "Entidades Centrais do Domínio",
        subtitle: "Linguagem Ubíqua & Modelo de Dados",
        render: () => `
          <div class="slide-body">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
              <div class="feature-item-deck">
                <strong style="color: #a855f7;">Locacao</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Contrato central com datas, cliente, valores e status (Emitido ➔ Entregue ➔ Devolvido).</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #38bdf8;">Cliente (Locatário)</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Pessoa física responsável civil e financeiramente pelas vestimentas alugadas.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #10b981;">Produto (Traje)</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Peça festiva catalogada com valor unitário, descrição e agenda de disponibilidade.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #f59e0b;">LocacaoProduto</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Item associado à locação contendo quantidade, valor unitário e subtotal.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #06b6d4;">TipoEvento</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Casamento, 15 Anos, Formatura ou Bodas para parametrização do contrato.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #f43f5e;">User / Segurança</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Operadores do sistema com perfis ROLE_USER e ROLE_ADMIN.</p>
              </div>
            </div>
          </div>
        `
      },
      {
        title: "Arquitetura 3D (Code City)",
        subtitle: "Visualização Espacial do Monólito",
        render: () => `
          <div class="slide-body" style="text-align: center;">
            <p style="margin-bottom: 1.5rem;">
              O sistema foi modelado em uma cidade 3D interativa onde cada arquivo é um prédio: altura mapeia linhas de código (LOC) e largura reflete a complexidade ciclomática.
            </p>
            <div style="background: #1e293b; padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color); display: inline-block;">
              <div style="font-size: 1.25rem; font-weight: 700; color: #38bdf8; margin-bottom: 0.5rem;">513 Módulos Mapeados</div>
              <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">Navegue com controles de câmera livre, rotação, zoom e filtros de camadas.</p>
              <a href="arquitetura.html" class="btn btn-primary" style="display: inline-flex;">Explorar Arquitetura 3D ➔</a>
            </div>
          </div>
        `
      },
      {
        title: "Módulos & Dependências",
        subtitle: "Grafo de Conectividade em D3.js",
        render: () => `
          <div class="slide-body">
            <p style="margin-bottom: 1rem;">
              O grafo de dependências revelou a estrutura em camadas clássica (Web ➔ Service ➔ Repository), com 295 conexões direcionadas.
            </p>
            <div class="feature-list-deck">
              <div class="feature-item-deck" style="border-left: 3px solid #ef4444;">
                <strong style="color: #ef4444;">7 Ciclos Identificados:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Acoplamentos bidirecionais entre DTOs e MapStruct Mappers pontuais.</p>
              </div>
              <div class="feature-item-deck" style="border-left: 3px solid #10b981;">
                <strong style="color: #10b981;">Camadas Coesas:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Isolamento transacional estrito garantido via Spring Framework.</p>
              </div>
            </div>
            <div style="margin-top: 1.5rem; text-align: center;">
              <a href="modulos.html" class="btn" style="border-color: #10b981; color: #10b981;">Ver Mapa de Módulos 2D ➔</a>
            </div>
          </div>
        `
      },
      {
        title: "Métricas & Qualidade de Código",
        subtitle: "Hotspots Ciclomáticos & Distribuição",
        render: () => `
          <div class="slide-body">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem;">
              <div class="stat-item" style="text-align: center;">
                <span class="stat-num" style="color: #38bdf8;">513</span>
                <span class="stat-label">Arquivos</span>
              </div>
              <div class="stat-item" style="text-align: center;">
                <span class="stat-num" style="color: #10b981;">~35.000</span>
                <span class="stat-label">Linhas de Código</span>
              </div>
              <div class="stat-item" style="text-align: center;">
                <span class="stat-num" style="color: #ef4444;">LocacaoService</span>
                <span class="stat-label">Maior Hotspot Ciclomático</span>
              </div>
            </div>
            <p style="font-size: 0.85rem;">
              O dashboard quantitativo em Highcharts apresenta Treemap de pastas, Histograma de LOC, Sankey entre camadas e composição das linguagens (Java, TypeScript, HTML e YAML).
            </p>
            <div style="margin-top: 1rem; text-align: center;">
              <a href="metricas.html" class="btn btn-primary">Abrir Dashboard de Métricas ➔</a>
            </div>
          </div>
        `
      },
      {
        title: "Topologia & Infraestrutura",
        subtitle: "Arquitetura Atual vs Arquitetura Alvo",
        render: () => `
          <div class="slide-body">
            <div style="display: flex; gap: 1rem;">
              <div class="feature-item-deck" style="flex: 1; border-top: 3px solid #f59e0b;">
                <strong style="color: #f59e0b;">Atual (Monólito Legado):</strong>
                <ul style="font-size: 0.8rem; margin-top: 8px; padding-left: 1.2rem; line-height: 1.5;">
                  <li>Java 8 + Spring Boot 2.0 (EOL)</li>
                  <li>Angular 6.1 no mesmo JAR</li>
                  <li>MySQL 5.7 transacional</li>
                  <li>Elasticsearch 5.6 espelhado</li>
                </ul>
              </div>
              <div class="feature-item-deck" style="flex: 1; border-top: 3px solid #10b981;">
                <strong style="color: #10b981;">Alvo (Cloud Native):</strong>
                <ul style="font-size: 0.8rem; margin-top: 8px; padding-left: 1.2rem; line-height: 1.5;">
                  <li>Java 21 LTS + Spring Boot 3.3</li>
                  <li>SPA desacoplada em CDN (Angular 18+/React)</li>
                  <li>PostgreSQL 16 com Lock Otimista</li>
                  <li>OpenSearch / CDC síncrono</li>
                </ul>
              </div>
            </div>
            <div style="margin-top: 1.5rem; text-align: center;">
              <a href="topologia.html" class="btn">Visualizar Topologia Side-by-Side ➔</a>
            </div>
          </div>
        `
      },
      {
        title: "Próximos Passos & Recomendações",
        subtitle: "Evolução Segura com o Reversa",
        render: () => `
          <div class="slide-body">
            <div class="feature-list-deck" style="margin-bottom: 1.5rem;">
              <div class="feature-item-deck">
                <strong style="color: #38bdf8;">1. Implementar Validações do Backend:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Ativar recálculo obrigatório do saldo no <code>LocacaoServiceImpl</code> e bloqueio impeditivo na agenda (HTTP 400).</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #10b981;">2. Executar Ciclo Forward:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px;">Usar <code>/reversa-forward</code> para implementar features novas ou refatorações guiadas pelas specs geradas.</p>
              </div>
            </div>
            <div style="text-align: center;">
              <div style="color: #cbd5e1; font-size: 0.9rem; margin-bottom: 1rem;">O mini-site está 100% pronto para navegação offline.</div>
              <a href="index.html" class="btn btn-primary" style="padding: 0.6rem 1.5rem; font-size: 1rem;">Ir para Visão Geral (Index)</a>
            </div>
          </div>
        `
      }
    ];

    let currentSlide = 0;
    const slideViewport = document.getElementById("active-slide");
    const indicator = document.getElementById("slide-indicator");

    function renderSlide(index) {
      if (index < 0) index = 0;
      if (index >= SLIDES.length) index = SLIDES.length - 1;
      currentSlide = index;

      const s = SLIDES[currentSlide];
      slideViewport.innerHTML = `
        <div>
          <h1 class="slide-title">${s.title}</h1>
          <div class="slide-subtitle">${s.subtitle}</div>
        </div>
        <div class="slide-content">
          ${s.render()}
        </div>
      `;

      indicator.textContent = `Slide ${currentSlide + 1} de ${SLIDES.length}`;
    }

    document.getElementById("btn-prev-slide").addEventListener("click", () => renderSlide(currentSlide - 1));
    document.getElementById("btn-next-slide").addEventListener("click", () => renderSlide(currentSlide + 1));

    document.getElementById("btn-fullscreen").addEventListener("click", () => {
      const elem = document.querySelector(".deck-container");
      if (!document.fullscreenElement) {
        elem.requestFullscreen().catch(err => alert(`Erro fullscreen: ${err.message}`));
      } else {
        document.exitFullscreen();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") renderSlide(currentSlide - 1);
      if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") renderSlide(currentSlide + 1);
      if (e.key === "f" || e.key === "F") document.getElementById("btn-fullscreen").click();
    });

    renderSlide(0);
  </script>
</body>
</html>
