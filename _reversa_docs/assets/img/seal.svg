<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </radialGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo Circular -->
  <circle cx="400" cy="400" r="380" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Anéis Orbitais / Moiré -->
  <circle cx="400" cy="400" r="320" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6, 6"/>
  <circle cx="400" cy="400" r="260" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
  <circle cx="400" cy="400" r="200" fill="none" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="12, 8"/>
  <circle cx="400" cy="400" r="140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4, 4"/>

  <!-- Linhas Radiais e Nós Poligonais -->
  <g stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5">
    <line x1="720.0" y1="400.0" x2="540.0" y2="400.0" />
    <circle cx="720.0" cy="400.0" r="4" fill="#38bdf8" /><line x1="677.1" y1="560.0" x2="521.2" y2="470.0" />
    <circle cx="677.1" cy="560.0" r="4" fill="#38bdf8" /><line x1="560.0" y1="677.1" x2="470.0" y2="521.2" />
    <circle cx="560.0" cy="677.1" r="4" fill="#38bdf8" /><line x1="400.0" y1="720.0" x2="400.0" y2="540.0" />
    <circle cx="400.0" cy="720.0" r="4" fill="#38bdf8" /><line x1="240.0" y1="677.1" x2="330.0" y2="521.2" />
    <circle cx="240.0" cy="677.1" r="4" fill="#38bdf8" /><line x1="122.9" y1="560.0" x2="278.8" y2="470.0" />
    <circle cx="122.9" cy="560.0" r="4" fill="#38bdf8" /><line x1="80.0" y1="400.0" x2="260.0" y2="400.0" />
    <circle cx="80.0" cy="400.0" r="4" fill="#38bdf8" /><line x1="122.9" y1="240.0" x2="278.8" y2="330.0" />
    <circle cx="122.9" cy="240.0" r="4" fill="#38bdf8" /><line x1="240.0" y1="122.9" x2="330.0" y2="278.8" />
    <circle cx="240.0" cy="122.9" r="4" fill="#38bdf8" /><line x1="400.0" y1="80.0" x2="400.0" y2="260.0" />
    <circle cx="400.0" cy="80.0" r="4" fill="#38bdf8" /><line x1="560.0" y1="122.9" x2="470.0" y2="278.8" />
    <circle cx="560.0" cy="122.9" r="4" fill="#38bdf8" /><line x1="677.1" y1="240.0" x2="521.2" y2="330.0" />
    <circle cx="677.1" cy="240.0" r="4" fill="#38bdf8" />
  </g>

  <!-- Hexágono Central com Geometria de Cristal (Crystal Lattice) -->
  <polygon points="400,260 521,330 521,470 400,540 279,470 279,330" fill="rgba(30, 41, 59, 0.85)" stroke="url(#neonBlue)" stroke-width="4" filter="url(#glow)"/>
  
  <polygon points="400,300 486,350 486,450 400,500 314,450 314,350" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-dasharray="8, 4"/>

  <!-- Núcleo Central: Ícone de Nó e Engrenagem -->
  <circle cx="400" cy="400" r="50" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="400" cy="400" r="24" fill="url(#neonBlue)"/>

  <!-- Carimbo de Autenticidade / Seed -->
  <text x="400" y="720" text-anchor="middle" font-family="monospace" font-size="12" fill="#64748b" letter-spacing="2">SEED: 37C7DBB187D4CECB</text>
  <text x="400" y="740" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="3">REVERSA ARCHITECTURAL SEAL</text>
</svg>
