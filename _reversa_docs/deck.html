  <style>
    .deck-viewport {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: #0a0f1d;
    }
    .slide-stage {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      padding: 3rem;
      position: relative;
      box-shadow: 0 12px 36px rgba(0,0,0,0.4);
    }
    .slide-header {
      margin-bottom: 1.5rem;
    }
    .slide-title {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .slide-subtitle {
      font-size: 1rem;
      color: var(--accent-blue);
      margin-top: 0.25rem;
    }
    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .deck-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 960px;
      margin-top: 1.25rem;
    }
    .deck-progress {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }
    .feature-list-deck {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }
    .feature-item-deck {
      background: #1e293b;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 1.2rem;
    }
  </style>
</head>

      {

              A solução gerencia o ciclo integral de reservas e aluguel de vestimentas para casamentos, formaturas e eventos de debutante, proporcionando velocidade máxima de atendimento na loja física sem latência de rede.
            </p>
            <div class="feature-list-deck">
              <div class="feature-item-deck">
                <strong style="color: #38bdf8;">Emissão Imediata em PDF:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Geração direta de minutas contratuais com valor legal para impressão física instantânea.</p>

              </div>
              <div class="feature-item-deck">

      {

        render: () => `
          <div class="slide-body">
            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
              <div class="feature-item-deck" style="flex: 1; border-top: 3px solid #38bdf8;">
                <strong style="color: #38bdf8;">1. Apresentação (internal/ui):</strong>
                <p style="font-size: 0.8rem; margin-top: 6px; color: var(--text-secondary);">Loop imediato Gio UI acelerado por GPU, padrão Cryptopower (Page, Widget, Theme Dark) e atalhos de teclado (F2, F5, ESC).</p>
              </div>
              <div class="feature-item-deck" style="flex: 1; border-top: 3px solid #10b981;">

              </div>
              <div class="feature-item-deck" style="flex: 1; border-top: 3px solid #f59e0b;">
                <strong style="color: #f59e0b;">3. Persistência (internal/storage):</strong>
                <p style="font-size: 0.8rem; margin-top: 6px; color: var(--text-secondary);">Driver Go puro modernc.org/sqlite (sem CGO), transações ACID locais, modo WAL e tabela virtual FTS5.</p>
              </div>
            </div>
            <div style="background: #0f172a; padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid var(--border-subtle); font-size: 0.8rem; color: #94a3b8; text-align: center;">
              Zero ciclos de dependência entre pacotes • Separação estrita entre UI e regras de negócio

      {
        title: "Invariantes Inegociáveis de Negócio",
        subtitle: "Blindagem de Regras no Núcleo de Domínio",
        render: () => `
          <div class="slide-body">

              </div>

              </div>
              <div class="feature-item-deck" style="border-left: 3px solid #ef4444;">
                <strong style="color: #ef4444;">4. Quitação na Retirada:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Transição para situação '2: Entregue' impedida categoricamente enquanto houver saldo devedor &gt; 0.</p>
              </div>
            </div>
          </div>
        `
      },
      {
        title: "Comparativo Arquitetural",
        subtitle: "Monólito Legado JHipster vs Desktop Go Nativo",
        render: () => `
          <div class="slide-body">
            <div style="display: flex; gap: 1rem;">
              <div class="feature-item-deck" style="flex: 1; border-top: 3px solid #ef4444;">
                <strong style="color: #ef4444;">Monólito Legado Substituído:</strong>
                <ul style="font-size: 0.8rem; margin-top: 8px; padding-left: 1.2rem; line-height: 1.5; color: var(--text-secondary);">
                  <li>Java 8 + Spring Boot 2.0 (EOL)</li>
                  <li>Single Page Application Angular 6.1</li>
                  <li>Banco MySQL 5.7 e Cluster Elasticsearch 5.6</li>
                  <li>Dual-write frágil e sincronização síncrona</li>
                  <li>Consumo de Memória: &gt; 1.2 GB RAM</li>
                </ul>
              </div>
              <div class="feature-item-deck" style="flex: 1; border-top: 3px solid #10b981;">
                <strong style="color: #10b981;">Desktop Go Implementado:</strong>
                <ul style="font-size: 0.8rem; margin-top: 8px; padding-left: 1.2rem; line-height: 1.5; color: var(--text-secondary);">
                  <li>Go 1.22 puro compilado nativamente</li>
                  <li>Interface Gráfica Desktop Gio UI (Cryptopower)</li>
                  <li>Banco embutido SQLite com modo WAL e FTS5</li>
                  <li>Motor autônomo de contratos em PDF nativo</li>
                  <li>Consumo de Memória: &lt; 85 MB RAM</li>
                </ul>
              </div>
            </div>
            <div style="margin-top: 1.25rem; text-align: center;">
              <a href="topologia.html" class="btn">Visualizar Topologia Side-by-Side ➔</a>
            </div>
          </div>
        `
      },
      {
        title: "Eficiência & Portabilidade Extrema",
        subtitle: "Zero Dependências Externas (Zero CGO)",
        render: () => `
          <div class="slide-body">
            <div class="feature-list-deck">
              <div class="feature-item-deck">
                <strong style="color: #38bdf8;">Binários Nativos Autônomos:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Executáveis únicos gerados para Windows 32-bit (x86), Windows 64-bit e Linux 64-bit sem instaladores pesados.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #10b981;">Inicialização Instantânea:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Abertura da interface gráfica em menos de 800 milissegundos, sem tempo de inicialização de JVM ou Electron.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #f59e0b;">Zero CGO:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Driver SQLite em Go puro (modernc.org/sqlite) garante facilidade total de compilação cruzada.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #a855f7;">Backup Simples & Resiliente:</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Cópia direta do arquivo <code>ducarmolocacoes.db</code> assegura cópia de segurança completa e íntegra.</p>
              </div>
            </div>
          </div>
        `
      },
      {
        title: "Especificação das Telas Desktop",
        subtitle: "Interface Gio UI Otimizada para Atendimento",
        render: () => `
          <div class="slide-body">
            <div class="feature-list-deck">
              <div class="feature-item-deck">
                <strong style="color: #38bdf8;">1. Lista de Locações (LocacaoListPage):</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Abas de filtragem por status (Novas, Emitidas, Entregues, Devolvidas), busca rápida e atalhos F2/F5.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #10b981;">2. Formulário de Locação (LocacaoFormPage):</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Seleção de itens com cálculo automático de 20% de sinal, aviso de colisão de agenda e emissão PDF.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #f59e0b;">3. Clientes & Locatários (ClientePage):</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Validação rigorosa de CPF, contatos múltiplos e consulta instantânea via índice FTS5.</p>
              </div>
              <div class="feature-item-deck">
                <strong style="color: #a855f7;">4. Catálogo de Vestuário (ProdutoPage):</strong>
                <p style="font-size: 0.8rem; margin-top: 4px; color: var(--text-secondary);">Controle de trajes, numeração, preço unitário de locação e histórico de reservas.</p>
              </div>
            </div>
          </div>
        `
      },
      {
        title: "Sumário Executivo",
        subtitle: "Sistema Pronto, Testado e Operacional",
        render: () => `
          <div class="slide-body" style="text-align: center;">
            <div style="font-size: 1.1rem; color: #fff; margin-bottom: 1.5rem; line-height: 1.6;">
              O projeto Du Carmo Locações foi completamente modernizado para um ecossistema Desktop ágil, moderno e estável.
            </div>
            <div style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem;">
              <a href="index.html" class="btn btn-primary">Ir para a Visão Geral ➔</a>
              <a href="arquitetura.html" class="btn">Explorar Cidade 3D (Code City)</a>
              <a href="metricas.html" class="btn">Ver Métricas de Código</a>
            </div>
            <div style="font-size: 0.85rem; color: var(--text-muted);">
              Mini-site documentacional gerado pelo Time Reversa Docs • Compatível com navegação offline via file://
            </div>
          </div>
        `
      }
    ];

    let currentSlideIdx = 0;
    const stage = document.getElementById("current-slide");
    const indicator = document.getElementById("slide-indicator");
    const btnPrev = document.getElementById("btn-prev-slide");
    const btnNext = document.getElementById("btn-next-slide");
    const btnFullscreen = document.getElementById("btn-fullscreen");

    function renderSlide(idx) {
      if (idx < 0) idx = 0;
      if (idx >= SLIDES.length) idx = SLIDES.length - 1;
      currentSlideIdx = idx;

      const s = SLIDES[currentSlideIdx];
      stage.innerHTML = `
        <div class="slide-header">
          <div class="slide-title">${s.title}</div>
          <div class="slide-subtitle">${s.subtitle}</div>
        </div>
        <div class="slide-content">
          ${s.render()}
        </div>
      `;

      indicator.textContent = `Slide ${currentSlideIdx + 1} de ${SLIDES.length}`;
      btnPrev.disabled = currentSlideIdx === 0;
      btnNext.disabled = currentSlideIdx === SLIDES.length - 1;
    }

    btnPrev.addEventListener("click", () => renderSlide(currentSlideIdx - 1));
    btnNext.addEventListener("click", () => renderSlide(currentSlideIdx + 1));

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
        renderSlide(currentSlideIdx + 1);
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        renderSlide(currentSlideIdx - 1);
      } else if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
      }
    });

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    btnFullscreen.addEventListener("click", toggleFullscreen);

    renderSlide(0);
  </script>
